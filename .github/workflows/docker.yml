name: 🚀 Build, Push & Run Docker Image

on:
push:
branches:
- master

jobs:
docker:
runs-on: ubuntu-latest

```
steps:
  # 1️⃣ Checkout code
  - name: Checkout code
    uses: actions/checkout@v4

  # 2️⃣ Login to Docker Hub
  - name: Login to DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # 3️⃣ Setup Docker Buildx
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  # 4️⃣ Build & Push Image
  - name: Build and Push Docker Image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: ${{ secrets.DOCKER_USERNAME }}/eduapplication:latest

  # 5️⃣ Pull Image (to ensure latest)
  - name: Pull Docker Image
    run: docker pull ${{ secrets.DOCKER_USERNAME }}/eduapplication:latest

  # 6️⃣ Remove old container if exists
  - name: Remove old container
    run: docker rm -f mycontainer || true

  # 7️⃣ Run Container
  - name: Run Container
    run: |
      docker run -d -p 5000:5000 --name mycontainer \
      ${{ secrets.DOCKER_USERNAME }}/eduapplication:latest

  # 8️⃣ Wait for container to start
  - name: Wait for container
    run: sleep 10

  # 9️⃣ Check container status
  - name: Check Container Running
    run: |
      echo "Container status:"
      docker ps
      echo "Running state:"
      docker inspect -f '{{.State.Running}}' mycontainer

  # 🔟 Optional: Test API (if Flask app)
  - name: Test Application
    run: |
      curl -f http://localhost:5000 || exit 1
```
